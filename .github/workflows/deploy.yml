name: 🚀 Build and Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How to increment the version (ignored when custom_tag is set). 'rebuild' rebuilds the image for the current tag without bumping the version — use it when only the base image or language version changed, not the code."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rebuild
      custom_tag:
        description: "Custom tag (e.g. v1.2.3). Overrides the automatic version bump when set."
        required: false
        type: string
      prerelease:
        description: "Mark as a prerelease?"
        required: false
        default: false
        type: boolean

jobs:
  # A job that `uses:` a reusable workflow can't have steps of its own before the call, so
  # GO_VERSION (read from .go-version) has to be resolved in a separate job first.
  resolve-build-args:
    name: 🔧 Resolve build args
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go_version: ${{ steps.go_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .go-version
        id: go_version
        run: echo "value=$(cat .go-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  deploy:
    name: 🚀 Build, Push & Deploy
    needs: resolve-build-args
    uses: devidence-dev/workflows/.github/workflows/cd-build-deploy-semver.yml@v1
    with:
      app_name: automation-hub
      dockerfile_path: deployments/docker/Dockerfile
      build_args: "GO_VERSION=${{ needs.resolve-build-args.outputs.go_version }}"
      values_path: kubernetes/internal-apps/automation-hub/values.yaml
      bump: ${{ inputs.bump }}
      custom_tag: ${{ inputs.custom_tag }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
