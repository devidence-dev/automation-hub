# Default texts of the hub's output. Every key can be overridden under `messages:` in the config.
# Placeholders such as {date} are filled by the code; an override must keep the same ones.
lang: en
failure:
  title: "❌ Renovate failed (exit {exit}) in pod {pod}"
fork:
  tag_caption: " (fork)"
  tag_document: "fork · informational only"
caption:
  header: "📦 <b>Dependency report</b> · {date}"
  all_up_to_date: "✅ All up to date"
  repos_up_to_date: "✅ {count} repos up to date"
  more_repos: "… and {count} more repos (see report)"
  repo_line: "{emoji} {name} — {counts}"
  stats: "📊 {updated} outdated · {current} up to date"
  tabs: "🐳 Images: {images} · 📚 Packages: {packages}"
  charts: " · ⛵ Charts: {charts}"
  errors: "⚠️ {count} scan errors"
  emoji:
    major: "🔴"
    other: "🟡"
counts:
  major: "{count} major"
  minor: "{count} minor"
  patch: "{count} patch"
  separator: " · "
document:
  title: "Dependency report - Devidence"
  # Unused since batch 3: the eyebrow of each panel replaces the brand line. Kept so that an existing override still validates.
  brand: "Dependency report"
  eyebrow:
    deps: "Dependency report"
    images: "Image report"
    charts: "Chart report"
  tabs:
    label: "Report sections"
  tab:
    images: "Images"
    deps: "Dependencies"
    charts: "Charts"
  # Unused since batch 3: the panel shows the sub line instead. Kept so that an existing override still validates.
  total: "Total"
  pending: "Pending updates"
  up_to_date: "Up to date"
  distribution: "Update distribution"
  panel:
    sub: "pending out of {total} · {up_to_date} up to date"
  status:
    updates_bold: "{updates} updates"
    updates_bold_one: "{updates} update"
    updates_rest: "across {deps} dependencies"
    updates_rest_one: "across {deps} dependency"
    images_rest: "across {deps} images"
    images_rest_one: "across {deps} image"
    charts_rest: "across {deps} charts"
    charts_rest_one: "across {deps} chart"
    up_to_date: "All dependencies are up to date"
    images_up_to_date: "All images are up to date"
    charts_up_to_date: "All charts are up to date"
  # The update type names of the legend and of the row chips.
  type:
    patch: "patch"
    minor: "minor"
    major: "major"
  theme:
    group: "Theme"
    system: "Auto"
    light: "Light"
    dark: "Dark"
  # Unused since the copy-button redesign; kept so that an existing override still validates.
  available: "Available updates"
  # Unused since batch 3: the repo emoji and the emoji counters are not shown (decision a of the liquid glass port).
  # Kept so that an existing override still validates.
  summary:
    emoji:
      major: "🚨"
      minor: "⚠️"
      patch: "♻️"
    counter: "{emoji} {count}"
  # The columns are not rendered as table headers, except current and new, which label the versions for
  # screen readers. The other keys are unused; they stay so that an existing override of them still passes.
  columns:
    package_file: "Package file"
    repository: "Repository"
    current_image: "Current image"
    latest_image: "New image"
    dependency: "Dependency"
    current: "Current"
    new: "New"
    type: "Type"
  # Copy buttons are icon-only; the accessible name and tooltip are these labels. An image entry copies
  # only its latest reference. current_image is unused; it stays so that an existing override still
  # passes startup validation.
  copy:
    current_image: "Copy current image"
    latest_image: "Copy new image"
    copied: "Copied!"
    copied_before: "Copy (copied before)"
    new_version: "Copy name@version"
  export:
    button: "Export"
    title: "Export updates"
    copy: "Copy YAML"
    download: "Download YAML"
    close: "Close"
  errors:
    heading: "Scan errors"
    count: "{count} errors"
    count_one: "{count} error"
    root: "root"
    # Unused since batch 3: the errors card shows the repo and the message in two cells.
    item: "{where}: {msg}"
bot:
  unknown_command: "❓ Unknown command."
  unauthorized: "🚫 You are not authorized to run this command."
  workflow_dispatched: "🚀 Workflow *{workflow}* dispatched successfully. View it at {run_url}"
  dispatch_failed: "❌ Failed to dispatch the workflow. Check the hub logs or try again later."
  scheduled_dispatch_failed: "❌ Scheduled run of `{command}` failed to dispatch. Check the hub logs or try again later."
  job_created: "🚀 Job *{job}* created from *{cronjob}*."
  job_failed: "❌ Failed to create the job. Check the hub logs or try again later."
  scheduled_job_failed: "❌ Scheduled run of `{command}` failed to create the job. Check the hub logs or try again later."
  restart_triggered: "🔄 Deployment *{deployment}* restart triggered. Waiting for it to come back online..."
  restart_failed: "❌ Failed to restart the deployment. Check the hub logs or try again later."
  restart_ready: "✅ Deployment *{deployment}* is up and running again."
  restart_timeout: "⏱️ Deployment *{deployment}* did not report ready within {timeout} — check it manually."
torrent:
  card:
    title: "<b>{title}</b>"
    title_linked: "<a href=\"{url}\"><b>{title}</b></a>"
    year: " ({year})"
    episode: " · {episode}"
    imdb_url: "https://www.imdb.com/title/{id}/"
    imdb_rating: "⭐ IMDb: {rating}"
    imdb_votes: " ({votes} votes)"
    metacritic: "Ⓜ️ Metacritic: {rating}"
    rotten_tomatoes: "🍅 Rotten Tomatoes: {rating}"
    genre: "🎭 {genre}"
    runtime: "⏱ {runtime}"
    rated: "🔞 {rated}"
    tags: "🏷 {tags}"
    director: "🎬 Director: {director}"
    cast: "👥 Cast: {cast}"
    plot: "<blockquote expandable>{plot}</blockquote>"
    plot_truncated: "{text}…"
    button: "Open on IMDb"
    separator: " · "
    tags_separator: ", "
