name: 🚀 CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci:
    name: 🧪 CI
    uses: devidence-dev/workflows/.github/workflows/ci-go.yml@v1
    with:
      go_version_file: ".go-version"
      build_target: "./cmd/automation-hub"
      build_output: "automation-hub"
      build_goarch: "arm64"
    permissions:
      contents: read
      id-token: write
