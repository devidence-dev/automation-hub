# Project identification
# TODO: confirm sonar.projectKey in SonarCloud (Project Information) after the
# repository is imported. SonarCloud assigns it automatically during import,
# and it does not always follow the <org>_<repo> format.
sonar.organization=devidence-dev
sonar.projectKey=devidence-dev_automation-hub
sonar.projectName=Automation Hub
sonar.projectVersion=1.0

# Source and exclusion configuration
sonar.sources=.
# input.css is the Tailwind v4 source; Sonar's CSS parser does not understand `@utility` nesting and reports false positives.
# Biome (tailwindDirectives) lints it in the gate instead.
sonar.exclusions=**/vendor/**,**/*_test.go,**/testdata/**,build/**,deployments/**,docker-compose*.yml,**/*.md,graphify-out/**,**/*_templ.go,internal/services/depreport/assets/depreport.min.css,internal/services/depreport/assets/input.css

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

# Coverage (Go)
sonar.go.coverage.reportPaths=coverage.out

# Wiring/entry point that is not worth mocking; report.js has no JS test harness (Biome lints it,
# its markup contract is tested from Go), and the coverage report is Go-only
sonar.coverage.exclusions=cmd/automation-hub/main.go,internal/services/depreport/assets/report.js

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate - Wait for the result and fail if it does not pass
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
